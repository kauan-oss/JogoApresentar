name: Validar Ursina 3D
on:
  push:
    branches: [ursina-3d-rebuild]
  pull_request:
    branches: [main]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar sintaxe de todos os modulos
        run: python -m compileall -q main.py personagem.py cenario.py colisao.py menu.py
      - name: Testar combate 3D sem janela
        run: python -m unittest discover -s tests -v
      - name: Instalar motor grafico
        run: python -m pip install -r requirements.txt
      - name: Validar imports do jogo
        run: python -c "import main, personagem, cenario, menu; print('Modulos Ursina OK')"
      - name: Abrir o jogo no display virtual
        run: PYTHONPATH=. xvfb-run -a timeout 55s python tests/smoke_ursina.py
